[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_ldf_mode = chain+

build_flags =
    -IC:/Users/xxxte/.platformio/packages/framework-arduino-avr/libraries/SPI/src

lib_extra_dirs = C:/Users/xxxte/.platformio/packages/framework-arduino-avr/libraries

lib_deps =
    https://github.com/UdeS-GRO/LibRobUS
    adafruit/Adafruit TCS34725

monitor_speed = 9600